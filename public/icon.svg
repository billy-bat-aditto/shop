<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2a1b4e" />
      <stop offset="100%" stop-color="#0a0614" />
    </radialGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bff" />
      <stop offset="50%" stop-color="#6d4aff" />
      <stop offset="100%" stop-color="#4e2bc9" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4edea3" />
      <stop offset="100%" stop-color="#00b074" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Pharmacy Cross Glowing Base -->
  <g filter="url(#glow)">
    <!-- Vertical Bar -->
    <rect x="206" y="96" width="100" height="320" rx="36" fill="url(#crossGrad)" />
    <!-- Horizontal Bar -->
    <rect x="96" y="206" width="320" height="100" rx="36" fill="url(#crossGrad)" />
  </g>

  <!-- Inner Liquid Pill Highlight / Heartbeat Pulse -->
  <circle cx="256" cy="256" r="32" fill="#ffffff" fill-opacity="0.9" />
  <path d="M220 256 H242 L250 236 L262 276 L270 256 H292" stroke="#6d4aff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
